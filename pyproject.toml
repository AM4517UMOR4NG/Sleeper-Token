[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeper-token"
version = "0.1.0"
description = "Reproducible indirect prompt injection experiments for Indonesian RAG workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Alogo Situmorang"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
sleeper-token = "sleeper_token.cli:main"

[project.urls]
Repository = "https://github.com/AM4517UMOR4NG/Sleeper-Token"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sleeper_token = ["data/*.json"]
